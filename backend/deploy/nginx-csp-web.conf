# Content-Security-Policy for the web app (skor.space). Deliberately broad on sources (the app
# loads Google Fonts, Supabase, jsdelivr model runtime, Pexels video, Cloud Run) but closes the
# high-value holes: no plugins, no <base> hijack, no foreign framing, forms only to ourselves.
add_header Content-Security-Policy "default-src 'self' https: data: blob: wss:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
