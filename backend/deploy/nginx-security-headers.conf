# Included by the skor.space / api.skor.space server blocks (nginx-standalone.conf).
# `add_header` is not inherited into a location that sets its own, so locations that add a
# header include this file again.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), payment=()" always;
