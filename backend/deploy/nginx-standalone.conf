worker_processes 1;
pid /tmp/nginx-kuasaprestij.pid;
error_log /var/log/nginx/kuasaprestij-error.log;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format kuasa '$remote_addr [$time_local] "$request" $status origin="$http_origin"';
    access_log /var/log/nginx/kuasaprestij-access.log kuasa;

    # Compress text responses (JS/CSS/HTML/JSON/SVG): the app bundle is ~4x smaller on the wire.
    # Caddy passes the encoding through untouched. Images/video/wasm are already compact.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    # Use /tmp so the nobody worker can write proxy buffers without permission errors.
    proxy_temp_path /tmp/nginx_proxy_temp;

    server {
        server_name api.kuasa.tech;

        # Backend API — specific paths only
        location ~ ^/(start_session|start_diagnostic_session|submit_answer|teacher_insights|teacher/|admin/|suggest_topic|subjects|mastery_map|student_insights|student_dashboard|student/|generate_lesson|generate_quiz|lesson/|quiz/|submit_feedback|process_feedback|chat|resume_session|session/|session_challenge/|diagnostic_status|diagnostic_progress|listening_audio/|remediation_plan/|student_coach/|leaderboard|penalty_game_result|classroom_live/|quick_join|google/|class_question_history|webhook/|tts/|docs|openapi\.json) {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        # Force Vite to return actual CSS for bare stylesheet <link> fetch (no query string).
        # Module imports (?url, HMR ?t=…) are passed through unchanged.
        location = /src/styles.css {
            if ($query_string = "") {
                rewrite ^(.*)$ /src/styles.css?direct break;
            }
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # Frontend (Vite dev on port 3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            # Stream Vite responses directly — avoids permission errors on the
            # shared proxy temp dir when the worker runs as nobody.
            proxy_buffering off;
        }

        listen 8443 ssl;
        ssl_certificate /etc/ssl/kuasaprestij/fullchain.pem;
        ssl_certificate_key /etc/ssl/kuasaprestij/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
    }

    # KuasaPrestij — plain HTTP for Caddy SSL termination (port 443 via Caddyfile)
    # Mirrors the 8443 SSL block; Caddy handles TLS, nginx handles routing.
    #
    # Two server blocks, split by Host (Caddy passes the Host header through):
    #   skor.space / www.skor.space  -> the web app only (below)
    #   api.skor.space (+ default)   -> API paths to :8001, everything else to the web app
    # Why: the API path regex below contains names that are also web-app pages
    # (`leaderboard`, `lesson/`), so on the site host /leaderboard rendered raw JSON and
    # /lesson/<id> returned a 500. The web app only calls the API at api.skor.space.
    server {
        listen 8445;
        server_name skor.space www.skor.space;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }

    server {
        listen 8445 default_server;
        server_name api.skor.space api.kuasa.tech;

        # API docs / schema are for developers: reach them on the box at :8001, not the internet.
        # Must stay above the API regex (first matching regex location wins).
        location ~ ^/(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        location ~ ^/(start_session|start_diagnostic_session|submit_answer|teacher_insights|teacher/|admin/|suggest_topic|subjects|mastery_map|student_insights|student_dashboard|student/|generate_lesson|generate_quiz|lesson/|quiz/|submit_feedback|process_feedback|chat|resume_session|session/|session_challenge/|diagnostic_status|diagnostic_progress|listening_audio/|remediation_plan/|student_coach/|leaderboard|penalty_game_result|classroom_live/|quick_join|google/|class_question_history|webhook/|tts/|docs|openapi\.json) {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
        }

        location = /src/styles.css {
            if ($query_string = "") {
                rewrite ^(.*)$ /src/styles.css?direct break;
            }
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }
}
