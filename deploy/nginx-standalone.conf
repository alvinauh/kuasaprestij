worker_processes 1;
pid /tmp/nginx-kuasaprestij.pid;
error_log /var/log/nginx/kuasaprestij-error.log;

events {
    worker_connections 512;
}

http {
    log_format kuasa '$remote_addr [$time_local] "$request" $status origin="$http_origin"';
    access_log /var/log/nginx/kuasaprestij-access.log kuasa;

    # Use /tmp so the nobody worker can write proxy buffers without permission errors.
    proxy_temp_path /tmp/nginx_proxy_temp;

    server {
        server_name api.kuasa.tech;

        # Backend API — specific paths only
        location ~ ^/(start_session|start_diagnostic_session|submit_answer|teacher_insights|teacher/|admin/|suggest_topic|subjects|mastery_map|student_insights|student_dashboard|student/|generate_lesson|generate_quiz|lesson/|quiz/|submit_feedback|process_feedback|chat|resume_session|session/|session_challenge/|diagnostic_status|diagnostic_progress|listening_audio/|remediation_plan/|student_coach/|leaderboard|penalty_game_result|webhook/|docs|openapi\.json) {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
        }

        # Force Vite to return actual CSS for bare stylesheet <link> fetch (no query string).
        # Module imports (?url, HMR ?t=…) are passed through unchanged.
        location = /src/styles.css {
            if ($query_string = "") {
                rewrite ^(.*)$ /src/styles.css?direct break;
            }
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # Frontend (Vite dev on port 3000)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            # Stream Vite responses directly — avoids permission errors on the
            # shared proxy temp dir when the worker runs as nobody.
            proxy_buffering off;
        }

        listen 8443 ssl;
        ssl_certificate /etc/ssl/kuasaprestij/fullchain.pem;
        ssl_certificate_key /etc/ssl/kuasaprestij/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
    }
}
