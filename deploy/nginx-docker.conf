# nginx for the docker-compose stack. Proxies to the `backend` and `frontend`
# service names on the compose network (vs 127.0.0.1 in nginx-standalone.conf,
# which is for the host-systemd deploy). Listens on :80; a TLS block is provided
# commented below — enable it once certs are mounted (see docker-compose.yml).

worker_processes 1;
error_log /var/log/nginx/error.log;

events {
    worker_connections 512;
}

http {
    log_format kuasa '$remote_addr [$time_local] "$request" $status origin="$http_origin"';
    access_log /var/log/nginx/access.log kuasa;
    proxy_temp_path /tmp/nginx_proxy_temp;

    # Resolve compose service names at runtime.
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;

        # Backend API — specific paths only.
        location ~ ^/(start_session|start_diagnostic_session|submit_answer|teacher_insights|teacher/|admin/|suggest_topic|subjects|mastery_map|student_insights|student_dashboard|student/|generate_lesson|generate_quiz|lesson/|quiz/|submit_feedback|process_feedback|chat|resume_session|session/|session_challenge/|diagnostic_status|diagnostic_progress|listening_audio/|remediation_plan/|student_coach/|leaderboard|penalty_game_result|webhook/|docs|openapi\.json) {
            proxy_pass http://backend:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Essays are marked by a live LLM call that can take minutes.
            proxy_read_timeout 600;
        }

        # Force Vite to return actual CSS for a bare stylesheet <link> (no query).
        location = /src/styles.css {
            if ($query_string = "") {
                rewrite ^(.*)$ /src/styles.css?direct break;
            }
            proxy_pass http://frontend:3000;
            proxy_set_header Host localhost;
            proxy_buffering off;
        }

        # Frontend (Vite dev on 3000). The Upgrade/Connection headers keep the
        # HMR websocket alive; drop them once you move to the Tier-2 Node build.
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_buffering off;
        }
    }

    # ── TLS (enable the 443 port + cert volume in docker-compose.yml) ──
    # server {
    #     listen 443 ssl;
    #     server_name api.kuasa.tech;
    #     ssl_certificate     /etc/ssl/kuasaprestij/fullchain.pem;
    #     ssl_certificate_key /etc/ssl/kuasaprestij/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     # ... duplicate the three location blocks above ...
    # }
}
