# Cloud Build CI/CD for the KuasaPrestij backend → Cloud Run.
# Triggered on push to the clean deploy branch (see deploy/CLOUDRUN_NOTES.md).
# Builds the repo-root Dockerfile, pushes to Artifact Registry, deploys to Cloud Run.
# The deploy step UPDATES the existing service, preserving its Secret Manager
# bindings and scaling settings (we don't re-specify --set-secrets here).

substitutions:
  _REGION: asia-southeast1
  _SERVICE: kuasaprestij-api
  _REPO: cloud-run-source-deploy   # Artifact Registry repo (already created)

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  machineType: E2_HIGHCPU_8   # faster torch/model build
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
